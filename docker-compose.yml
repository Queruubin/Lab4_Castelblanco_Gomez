services:
  postgres:
    image: postgres:16-alpine
    container_name: blueprints-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blueprints
      POSTGRES_USER: blueprints
      POSTGRES_PASSWORD: blueprints
    ports:
      # Host 5433 -> contenedor 5432 (evita conflicto con un PostgreSQL nativo en el host)
      - "5433:5432"
    volumes:
      - blueprints_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueprints -d blueprints"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  blueprints_pgdata:
