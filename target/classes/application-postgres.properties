# PostgreSQL datasource (perfil "postgres")
spring.datasource.url=jdbc:postgresql://localhost:5433/blueprints
spring.datasource.username=blueprints
spring.datasource.password=blueprints
spring.datasource.driver-class-name=org.postgresql.Driver

# Ejecuta schema.sql (creacion de tabla + datos de ejemplo) en cada arranque
spring.sql.init.mode=always
